<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231565d8'/%3E%3Ctext x='50' y='66' font-family='system-ui,sans-serif' font-size='58' font-weight='800' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
    
    <!-- Enhanced Responsive Viewport Meta Tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    
    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#1565d8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1a" />
    
    <!-- Enhanced Description -->
    <meta name="description" content="Connect It - Real-time chat application for seamless communication. Secure, fast, and responsive messaging for all devices." />
    <meta name="keywords" content="chat, messaging, real-time, communication, connect" />
    <meta name="author" content="Connect It Team" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    
    <!-- Apple Web App Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Connect It" />
    
    <!-- Mobile Web App Configuration -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Connect It" />
    
    <!-- Microsoft Tile Configuration -->
    <meta name="msapplication-TileColor" content="#1565d8" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Disable automatic phone number detection -->
    <meta name="format-detection" content="telephone=no" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Connect It - Real-time Chat" />
    <meta property="og:description" content="Secure, fast, and responsive messaging for all devices" />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Connect It - Real-time Chat" />
    <meta name="twitter:description" content="Secure, fast, and responsive messaging for all devices" />
    
    <title>Connect It - Real-time Chat Application</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Connect It chat application.</noscript>
    <div id="root"></div>
  </body>
</html>
