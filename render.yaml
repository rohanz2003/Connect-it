services:
  - type: web
    name: chat-app
    runtime: node
    branch: main
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      # Set real values in Render Dashboard → Environment (never commit secrets)
      - key: NODE_VERSION
        value: "20"
      - key: MONGO_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: onboarding@resend.dev
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_FEEDBACK_EMAIL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://connect-it.vercel.app
      - key: FIREBASE_PROJECT_ID
        sync: false
